name: Package

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    tags:
      - 'r*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.package_artifact.outputs.artifact-url }}
      artifact_digest: ${{ steps.package_artifact.outputs.artifact-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^r[1-9][0-9]*(-(alpha|beta))?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          toc_version="$(sed -n 's/^## Version:[[:space:]]*//p' BFInfinite.toc)"
          if [[ "$toc_version" != "$GITHUB_REF_NAME" ]]; then
            echo "BFInfinite.toc version '$toc_version' does not match tag '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Release tags must point to a commit on $DEFAULT_BRANCH." >&2
            exit 1
          fi

      - name: Read AbstractFramework lock
        id: abstract_framework
        shell: bash
        run: >-
          python3 ./scripts/check-af-integration.py
          --export-github-output "$GITHUB_OUTPUT"

      - name: Check out locked AbstractFramework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.abstract_framework.outputs.repository }}
          ref: ${{ steps.abstract_framework.outputs.revision }}
          path: .dependencies/AbstractFramework
          fetch-depth: 0
          persist-credentials: false

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua-check lua5.1 luajit ripgrep subversion unzip

      - name: Verify BFInfinite source
        run: bash ./scripts/verify.sh

      - name: Verify the dependency contract
        run: >-
          python3 ./scripts/check-af-integration.py
          --af-root .dependencies/AbstractFramework

      - name: Verify AbstractFramework source
        run: bash ./.dependencies/AbstractFramework/scripts/verify.sh

      - name: Build BFInfinite component
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28 # v2.5.1
        with:
          args: >-
            -d -g retail
            -r ${{ github.workspace }}/.release/components/bfinfinite

      - name: Locate BFInfinite component
        id: bfinfinite_component
        shell: bash
        run: |
          shopt -s nullglob
          packages=(.release/components/bfinfinite/*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one BFInfinite component package, found ${#packages[@]}." >&2
            exit 1
          fi
          echo "archive=$(realpath "${packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: Verify BFInfinite component
        env:
          PACKAGE: ${{ steps.bfinfinite_component.outputs.archive }}
        run: bash ./scripts/check-package.sh "$PACKAGE"

      - name: Build AbstractFramework component
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28 # v2.5.1
        with:
          args: >-
            -d -g retail
            -t .dependencies/AbstractFramework
            -r ${{ github.workspace }}/.release/components/abstract-framework

      - name: Locate AbstractFramework component
        id: abstract_framework_component
        shell: bash
        run: |
          shopt -s nullglob
          packages=(.release/components/abstract-framework/*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one AbstractFramework component package, found ${#packages[@]}." >&2
            exit 1
          fi
          echo "archive=$(realpath "${packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: Verify AbstractFramework component
        env:
          PACKAGE: ${{ steps.abstract_framework_component.outputs.archive }}
        run: >-
          bash ./.dependencies/AbstractFramework/scripts/check-package.sh "$PACKAGE"

      - name: Generate exact release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
        shell: bash
        env:
          AF_REVISION: ${{ steps.abstract_framework.outputs.revision }}
          AF_VERSION: ${{ steps.abstract_framework.outputs.version }}
        run: |
          lua5.1 ./scripts/generate-changelog.lua \
            --version "$GITHUB_REF_NAME" \
            --release-notes .release/RELEASE_NOTES.md
          {
            echo
            echo "### Bundled dependency"
            echo
            echo "- AbstractFramework $AF_VERSION at commit $AF_REVISION"
          } >> .release/RELEASE_NOTES.md

      - name: Assemble installable bundle
        id: bundle
        shell: bash
        env:
          AF_PACKAGE: ${{ steps.abstract_framework_component.outputs.archive }}
          AF_REPOSITORY: ${{ steps.abstract_framework.outputs.repository }}
          AF_REVISION: ${{ steps.abstract_framework.outputs.revision }}
          AF_VERSION: ${{ steps.abstract_framework.outputs.version }}
          BFI_PACKAGE: ${{ steps.bfinfinite_component.outputs.archive }}
        run: |
          bfi_version="$(sed -n 's/^## Version:[[:space:]]*//p' BFInfinite.toc)"
          if [[ ! "$bfi_version" =~ ^r[1-9][0-9]*(-(alpha|beta))?$ ]]; then
            echo "Unsupported BFInfinite TOC version: $bfi_version" >&2
            exit 1
          fi
          bundle_version="$bfi_version"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            bundle_version="$bfi_version-${GITHUB_SHA:0:7}"
          fi
          bundle="$GITHUB_WORKSPACE/.release/BFInfinite-$bundle_version.zip"
          provenance="$GITHUB_WORKSPACE/.release/BUNDLE-MANIFEST.json"
          python3 ./scripts/composite-package.py assemble \
            --bfinfinite-package "$BFI_PACKAGE" \
            --abstract-framework-package "$AF_PACKAGE" \
            --af-repository "$AF_REPOSITORY" \
            --af-sha "$AF_REVISION" \
            --af-version "$AF_VERSION" \
            --output "$bundle" \
            --provenance "$provenance"
          echo "archive=$bundle" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"

      - name: Verify installable bundle
        shell: bash
        env:
          AF_PACKAGE: ${{ steps.abstract_framework_component.outputs.archive }}
          AF_REPOSITORY: ${{ steps.abstract_framework.outputs.repository }}
          AF_REVISION: ${{ steps.abstract_framework.outputs.revision }}
          AF_VERSION: ${{ steps.abstract_framework.outputs.version }}
          BFI_PACKAGE: ${{ steps.bfinfinite_component.outputs.archive }}
          BUNDLE: ${{ steps.bundle.outputs.archive }}
          PROVENANCE: ${{ steps.bundle.outputs.provenance }}
        run: |
          python3 ./scripts/composite-package.py check \
            --bfinfinite-package "$BFI_PACKAGE" \
            --abstract-framework-package "$AF_PACKAGE" \
            --af-repository "$AF_REPOSITORY" \
            --af-sha "$AF_REVISION" \
            --af-version "$AF_VERSION" \
            --archive "$BUNDLE" \
            --provenance "$PROVENANCE"

      - name: Create checksum
        shell: bash
        env:
          BUNDLE: ${{ steps.bundle.outputs.archive }}
          PROVENANCE: ${{ steps.bundle.outputs.provenance }}
        run: |
          cd .release
          sha256sum -- \
            "$(basename "$BUNDLE")" \
            "$(basename "$PROVENANCE")" \
            > SHA256SUMS

      - name: Upload package artifact
        id: package_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BFInfinite-${{ github.run_id }}
          path: |
            .release/BFInfinite-*.zip
            .release/BUNDLE-MANIFEST.json
            .release/SHA256SUMS
            .release/RELEASE_NOTES.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  pr-package-comment:
    name: Link PR package
    if: >-
      ${{
        always()
        && github.event_name == 'pull_request'
        && needs.package.result != 'cancelled'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update package link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ARTIFACT_URL: ${{ needs.package.outputs.artifact_url }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- bfinfinite-pr-package -->'
          short_sha="${PR_HEAD_SHA:0:7}"
          commit_url="${GITHUB_SERVER_URL}/${GH_REPO}/commit/${PR_HEAD_SHA}"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          live_head_sha="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [[ "$live_head_sha" != "$PR_HEAD_SHA" ]]; then
            echo "Skipping stale package comment for $PR_HEAD_SHA; current PR head is $live_head_sha."
            exit 0
          fi

          if [[ "$PACKAGE_RESULT" == "success" && -n "$ARTIFACT_URL" ]]; then
            {
              echo "$marker"
              echo "### Installable PR package"
              echo
              echo "Latest validated package for PR head [\`$short_sha\`]($commit_url):"
              echo
              echo "- [Download the BFInfinite + AbstractFramework package, manifest, and checksum]($ARTIFACT_URL)"
              echo "- [View package workflow run]($RUN_URL)"
              echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
              echo
              echo "The link updates after every pushed commit and expires after 14 days. GitHub sign-in is required."
            } > "$body_file"
          else
            {
              echo "$marker"
              echo "### Installable PR package"
              echo
              echo "No package is available for PR head [\`$short_sha\`]($commit_url) because the latest package job finished with **$PACKAGE_RESULT**."
              echo
              echo "[View the package workflow run]($RUN_URL) for details."
            } > "$body_file"
          fi

          comment_id="$(
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- bfinfinite-pr-package -->")))][0].id // empty'
          )"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
              --raw-field body="$(<"$body_file")" >/dev/null
            echo "Updated PR package comment $comment_id."
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --raw-field body="$(<"$body_file")" >/dev/null
            echo "Created PR package comment."
          fi

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: BFInfinite-${{ github.run_id }}
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/SHA256SUMS dist/BUNDLE-MANIFEST.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            "${prerelease[@]}"

name: Lua checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua-check lua5.1 ripgrep

      - name: Check Lua and policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.lua')
            ./scripts/lint.sh "${changed[@]}"
          else
            ./scripts/lint.sh
          fi

      - name: Test Retail compatibility fixes
        run: |
          lua5.1 tests/objective_tracker_12_1_compat_test.lua
          lua5.1 tests/experience_bar_disabled_texture_test.lua

      - name: Test first-load mouse deselection default
        run: lua5.1 tests/core_mouse_deselect_default_test.lua

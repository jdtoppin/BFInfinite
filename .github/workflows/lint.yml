name: Lua checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua-check lua5.1 luajit ripgrep

      - name: Check Lua and policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.lua')
            ./scripts/lint.sh "${changed[@]}"
          else
            ./scripts/lint.sh
          fi

      - name: Test 12.1 unit-frame aura controller
        run: luajit tests/unit_frame_aura_controller_test.lua

      - name: Test Party native-aura integration
        run: luajit tests/unit_frame_party_native_aura_test.lua

      - name: Test Party shipped aura contracts
        run: luajit tests/unit_frame_party_aura_contract_test.lua

      - name: Test 12.1 unit-frame aura policy
        run: luajit tests/unit_frame_aura_policy_test.lua

      - name: Test 12.1 unit-frame aura spec
        run: luajit tests/unit_frame_aura_spec_test.lua

      - name: Test 12.1 unit-frame aura runtime
        run: luajit tests/unit_frame_aura_runtime_test.lua

      - name: Test Target unit-frame native aura integration
        run: luajit tests/unit_frame_target_native_aura_test.lua

      - name: Test unit-frame aura options
        run: luajit tests/unit_frame_aura_options_test.lua

      - name: Test unit-frame aura filter options
        run: luajit tests/unit_frame_aura_filter_options_test.lua

      - name: Test unit-frame aura Global Colors
        run: luajit tests/unit_frame_aura_spell_colors_test.lua

      - name: Test unit-frame aura Global Colors options
        run: luajit tests/unit_frame_aura_colors_options_test.lua

      - name: Test unit-frame config-mode lifecycle
        run: luajit tests/unit_frame_config_mode_lifecycle_test.lua

      - name: Test secure group-header unit routing
        run: luajit tests/unit_frame_group_header_routing_test.lua

      - name: Test 12.1 Player aura integration
        run: luajit tests/unit_frame_player_native_aura_test.lua

      - name: Test 12.1 Boss aura integration
        run: luajit tests/unit_frame_boss_native_aura_test.lua

      - name: Test 12.1 Focus aura integration
        run: luajit tests/unit_frame_focus_native_aura_test.lua

      - name: Test secret-safe unit-target routing
        run: luajit tests/unit_frame_unit_target_routing_test.lua

      - name: Test 12.1 TargetTarget aura integration
        run: luajit tests/unit_frame_targettarget_native_aura_test.lua

      - name: Test 12.1 FocusTarget aura integration
        run: luajit tests/unit_frame_focustarget_native_aura_test.lua

      - name: Test 12.1 PetTarget aura integration
        run: luajit tests/unit_frame_pettarget_native_aura_test.lua

      - name: Test secret-safe Pet owner routing
        run: luajit tests/unit_frame_pet_owner_routing_test.lua

      - name: Test 12.1 Pet aura integration
        run: luajit tests/unit_frame_pet_native_aura_test.lua

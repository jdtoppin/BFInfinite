name: Lua checks

on:
  merge_group:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: lua-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua-check lua5.1 luajit ripgrep

      - name: Check Buffs & Debuffs backend selection
        run: lua5.1 tests/buffs_debuffs_backend_selector_test.lua

      - name: Check Buffs & Debuffs native aura frame suppression
        run: lua5.1 tests/buffs_debuffs_native_aura_frames_test.lua

      - name: Check Buffs & Debuffs Blizzard Debuff styling
        run: lua5.1 tests/buffs_debuffs_blizzard_debuff_style_test.lua

      - name: Check Buffs & Debuffs custom aura controller
        run: lua5.1 tests/buffs_debuffs_custom_aura_controller_test.lua

      - name: Check Buffs & Debuffs custom Buffs compiler
        run: lua5.1 tests/buffs_debuffs_custom_buffs_spec_test.lua

      - name: Check Buffs & Debuffs profile normalization
        run: lua5.1 tests/buffs_debuffs_profile_normalization_test.lua

      - name: Check Buffs & Debuffs options policy
        run: lua5.1 tests/buffs_debuffs_options_policy_test.lua

      - name: Check Lua and policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.lua')
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BEFORE_SHA...HEAD" -- '*.lua')
          else
            changed=()
          fi
          bash ./scripts/verify.sh "${changed[@]}"

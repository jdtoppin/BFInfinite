name: Lua checks

on:
  merge_group:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: lua-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read AbstractFramework lock
        id: abstract_framework
        run: python3 ./scripts/check-af-integration.py --export-github-output "$GITHUB_OUTPUT"

      - name: Check out locked AbstractFramework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.abstract_framework.outputs.repository }}
          ref: ${{ steps.abstract_framework.outputs.revision }}
          path: .dependencies/AbstractFramework
          persist-credentials: false

      - name: Install Lua tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua-check lua5.1 luajit ripgrep

      - name: Check Lua and policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA...HEAD" -- '*.lua')
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BEFORE_SHA...HEAD" -- '*.lua')
          else
            changed=()
          fi
          bash ./scripts/verify.sh "${changed[@]}"

      - name: Check BFInfinite against AbstractFramework
        run: >-
          python3 ./scripts/check-af-integration.py
          --af-root .dependencies/AbstractFramework
